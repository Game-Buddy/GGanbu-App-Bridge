name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-application:
    name: Detect application source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect JavaScript or TypeScript source
        id: detect
        shell: bash
        run: |
          if find src src-tauri -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o -name '*.rs' \) -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CodeQL remains disabled until JavaScript or TypeScript source is present."
          fi

  analyze:
    name: JavaScript, TypeScript, and Rust
    needs: detect-application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Skip CodeQL when application source is unavailable
        if: needs.detect-application.outputs.available != 'true'
        run: echo "CodeQL remains disabled until JavaScript or TypeScript source is present."

      - name: Initialize CodeQL
        if: needs.detect-application.outputs.available == 'true'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript, rust
          build-mode: none

      - name: Analyze
        if: needs.detect-application.outputs.available == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:javascript-typescript-rust
