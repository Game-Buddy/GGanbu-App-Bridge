name: Desktop release and Store package

on: # zizmor: ignore[dangerous-triggers] Only successful push runs for trusted main commits are accepted below.
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
    branches: [main]

permissions: {}

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-gate:
    name: Verify all CI workflows
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
    steps:
      - name: Confirm successful workflows for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..48}; do
            echo "Waiting for Checks and desktop builds (attempt $attempt/48)..."
            conclusion="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Checks and desktop builds" \
              --commit "$RELEASE_SHA" \
              --event push \
              --status completed \
              --limit 20 \
              --json conclusion \
              --jq '.[0].conclusion // empty')"
            case "$conclusion" in
              success)
                exit 0
                ;;
              failure|cancelled)
                echo "Checks and desktop builds ended with $conclusion for $RELEASE_SHA" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Checks and desktop builds for $RELEASE_SHA" >&2
          exit 1

  preflight:
    name: Release preflight
    needs: workflow-gate
    if: needs.workflow-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Check out the tested main commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install pnpm 11.18.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate main version and changelog
        shell: bash
        run: |
          set -euo pipefail
          pnpm version:check
          expected_version="$(tr -d '[:space:]' < VERSION)"
          echo "Release candidate version: $expected_version"

      - name: Validate release licensing
        run: node scripts/license-check.mjs

      - name: Verify this run is the current main tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          test "$RELEASE_SHA" = "$main_commit" || {
            echo "main advanced after checks completed; refusing to release an older commit" >&2
            exit 1
          }

      - name: Decide whether this version needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          release_tag="v$version"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $release_tag; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
            tag_commit="$(git rev-list -n 1 "$release_tag^{commit}")"
            test "$tag_commit" = "$RELEASE_SHA" || {
              echo "Existing tag $release_tag does not point at the checked commit" >&2
              exit 1
            }
            echo "Using existing tag $release_tag for this retry."
          else
            echo "No release exists for $release_tag; the approved release job will create it."
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux AppImage
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GGANBU_RELEASE_BUILD: "1"
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm 11.18.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          pnpm version:check
          expected_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${RELEASE_TAG#v}"
          test "$tag_version" = "$expected_version" || {
            echo "Tag $RELEASE_TAG does not match VERSION $expected_version" >&2
            exit 1
          }

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.94.1

      - name: Restore Rust release build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-linux-x86_64

      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        run: pnpm tauri build --bundles appimage

      - name: Verify license notices
        run: pnpm license:check

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: gganbu-app-bridge.spdx.json
          upload-artifact: false

      - name: Upload unsigned Linux files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            gganbu-app-bridge.spdx.json
          if-no-files-found: error

  sign-linux:
    name: Sign Linux AppImage
    needs: [preflight, build-linux]
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download unsigned Linux files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-linux-x86_64
          path: unsigned

      - name: Sign AppImage and create checksums
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${LINUX_GPG_PRIVATE_KEY:-}" || {
            echo "LINUX_GPG_PRIVATE_KEY is required for releases" >&2
            exit 1
          }
          mkdir -p release
          mapfile -t appimages < <(find unsigned -type f -name '*.AppImage' -print)
          test "${#appimages[@]}" -gt 0 || {
            echo "Tauri did not produce an AppImage" >&2
            exit 1
          }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          for appimage in "${appimages[@]}"; do
            cp "$appimage" release/
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${LINUX_GPG_PASSPHRASE:-}" \
              --detach-sign --armor "release/$(basename "$appimage")"
          done
          tag_version="${RELEASE_TAG#v}"
          source_name="gganbu-app-bridge-${tag_version}-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="gganbu-app-bridge-${tag_version}/" \
            --output="release/${source_name}" \
            HEAD
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${LINUX_GPG_PASSPHRASE:-}" \
            --detach-sign --armor "release/${source_name}"
          cp unsigned/gganbu-app-bridge.spdx.json release/
          (cd release && sha256sum -- * > SHA256SUMS-linux-x86_64)

      - name: Attest signed AppImage
        if: vars.ENABLE_BUILD_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.AppImage

      - name: Attest SBOM
        if: vars.ENABLE_BUILD_ATTESTATIONS == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/*.AppImage
          sbom-path: release/gganbu-app-bridge.spdx.json

      - name: Upload Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-linux-x86_64
          path: release
          if-no-files-found: error

  build-windows:
    name: Windows Store MSIX
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GGANBU_RELEASE_BUILD: "1"
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install pnpm 11.18.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.18.0
          run_install: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Windows App CLI
        uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495 # v0.2

      - name: Check release version
        shell: pwsh
        run: |
          pnpm version:check
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -ne $expectedVersion) {
            throw "Tag $env:RELEASE_TAG does not match VERSION $expectedVersion"
          }

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.94.1

      - name: Restore Rust release build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows-x86_64

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows application
        run: pnpm tauri build --no-bundle

      - name: Prepare MSIX package layout
        id: msix
        run: pnpm msix:prepare

      - name: Create unsigned Store MSIX and checksum
        shell: pwsh
        env:
          MSIX_FILENAME: ${{ steps.msix.outputs.msix_filename }}
        run: |
          $output = Join-Path "target/msix" $env:MSIX_FILENAME
          winapp pack "target/msix/package" `
            --manifest "target/msix/package/Package.appxmanifest" `
            --output $output `
            --skip-pri `
            --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "winapp failed to create the MSIX package"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $output).Hash.ToLowerInvariant()
          $checksum = "$hash  $env:MSIX_FILENAME`n"
          [IO.File]::WriteAllText(
            "target/msix/SHA256SUMS-windows-x86_64",
            $checksum,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Report Store identity status
        shell: pwsh
        env:
          IDENTITY_CONFIGURED: ${{ steps.msix.outputs.identity_configured }}
        run: |
          if ($env:IDENTITY_CONFIGURED -eq "true") {
            "MSIX uses the configured Partner Center identity and is ready for submission." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "⚠️ MSIX uses development identity placeholders and must not be submitted to Partner Center." >> $env:GITHUB_STEP_SUMMARY
            throw "Set MSIX_IDENTITY_NAME, MSIX_PUBLISHER, and MSIX_PUBLISHER_DISPLAY_NAME before releasing a Store package"
          }

      - name: Upload unsigned Store submission package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-submission-windows-x86_64
          path: |
            target/msix/*.msix
            target/msix/SHA256SUMS-windows-x86_64
            target/msix/submission-metadata.json
          if-no-files-found: error
          retention-days: 90

  create-release-tag:
    name: Create release tag
    needs: [preflight, sign-linux, build-windows]
    if: needs.preflight.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create tag after signed artifacts succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          main_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$RELEASE_SHA" = "$main_commit" || {
            echo "main advanced during release approval; refusing to tag an older commit" >&2
            exit 1
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
            exit 0
          fi

          tag_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f "tag=$RELEASE_TAG" \
            -f "message=Release $RELEASE_TAG" \
            -f "object=$RELEASE_SHA" \
            -f "type=commit" \
            --jq .sha)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$tag_sha" >/dev/null

  publish:
    name: Publish signed release
    needs: [preflight, sign-linux, build-windows, create-release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
    permissions:
      contents: write
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download Linux release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x86_64
          path: release-files

      - name: Verify and assemble release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t platform_checksums < <(find release-files -type f -name 'SHA256SUMS-*' -print | sort)
          test "${#platform_checksums[@]}" -gt 0 || {
            echo "Platform checksum files are missing" >&2
            exit 1
          }
          find release-files -type f -not -name 'SHA256SUMS-*' -exec cp {} release/ \;
          test -n "$(find release -type f -print -quit)"
          for checksum_file in "${platform_checksums[@]}"; do
            checksum_name="$(basename "$checksum_file")"
            cp "$checksum_file" "release/$checksum_name"
            (cd release && sha256sum --check "$checksum_name")
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG; nothing to publish."
            exit 0
          fi
          mapfile -t release_files < <(find release -maxdepth 1 -type f -print | sort)
          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_files[@]}" "${prerelease_args[@]}" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
