language: en-US
early_access: false

tone_instructions: >-
  Be concise and direct. Report concrete defects with their impact and a practical
  fix. Avoid style-only comments already covered by the repository's checks.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - WIP

  path_filters:
    - "!dist/**"
    - "!src-tauri/target/**"
    - "!src-tauri/gen/**"
    - "!src-tauri/assets/config/hotkeys/**/*.blkx"
    - "!pnpm-lock.yaml"
    - "!src-tauri/Cargo.lock"
    - "!src/version.ts"
    - "!THIRD_PARTY_NOTICES.md"

  path_instructions:
    - path: "src-tauri/src/**/*.rs"
      instructions: |
        Review this as a security-sensitive local service.
        - Check authentication, session ownership, origin enforcement, request limits, and validation before state changes.
        - Flag secrets or sensitive payloads written to logs or returned in errors.
        - Check shared state for races, unbounded growth, lock misuse, and cleanup gaps.
        - Check Linux and Windows behavior separately when code is platform-specific.
        - Require focused tests for protocol, security, and state-management changes.

    - path: "src/**/*.{ts,tsx}"
      instructions: |
        - Check bridge protocol compatibility, stale asynchronous state, effect cleanup, and error handling.
        - Check visible UI changes for keyboard access, useful status text, overflow, and narrow-window behavior.
        - Require tests for behavior changes. Do not request tests for generated version constants.

    - path: ".github/workflows/**"
      instructions: |
        - Check least-privilege permissions, immutable action pins, secret handling, and unsafe use of pull-request input.
        - Preserve the main-only workflow: feature branch to main, then an immutable version tag on the merged main commit.
        - Treat Linux and Windows build, signing, provenance, and publishing jobs as separate trust boundaries.

    - path: "scripts/**"
      instructions: |
        - Check scripts for partial writes, platform-specific line endings, unsafe command construction, and actionable failures.
        - VERSION is the application version source of truth. Version changes must stay synchronized through pnpm version:set and include CHANGELOG.md.

chat:
  auto_reply: true
